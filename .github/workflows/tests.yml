name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        filament: ['^4.15.2', '^5.10.2']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '11.*'
            testbench: '^9.16'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.3'
          - php: '8.2'
            pest: '^3.0'
            browser: false
          - php: '8.3'
            pest: '^4.0'
            browser: true
          - php: '8.4'
            pest: '^4.0'
            browser: true
        exclude:
          - php: '8.2'
            laravel: '13.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.filament }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo, sockets
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          if [ "${{ matrix.browser }}" = "true" ]; then
            composer require --dev "pestphp/pest-plugin-browser:${{ matrix.pest }}" --no-interaction --no-update
          else
            composer remove --dev pestphp/pest-plugin-browser --no-interaction --no-update
          fi
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed versions
        run: composer show | grep -E '^(filament/filament|livewire/livewire|laravel/framework|pestphp/pest|orchestra/testbench) '

      - name: Install Playwright
        if: matrix.browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Publish workbench assets
        run: vendor/bin/testbench workbench:build --ansi

      - name: Run tests
        run: vendor/bin/pest --ci ${{ matrix.browser && 'tests' || 'tests/Feature' }}

      - name: Upload browser test screenshots
        if: failure() && matrix.browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ strategy.job-index }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  assets:
    runs-on: ubuntu-latest
    name: Built assets are up to date

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-scripts
          npm ci

      - name: Build
        run: npm run build

      - name: Check resources/dist
        run: git diff --exit-code -- resources/dist
